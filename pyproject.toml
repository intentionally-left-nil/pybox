[project]
name = "pybox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"pybox/pybox.pth" = "pybox.pth"
"pybox/bin/pybox-launcher-darwin-arm64" = "pybox/bin/pybox-launcher-darwin-arm64"
"pybox/bin/pybox-launcher-darwin-amd64" = "pybox/bin/pybox-launcher-darwin-amd64"
"pybox/bin/pybox-launcher-linux-amd64" = "pybox/bin/pybox-launcher-linux-amd64"
"pybox/bin/pybox-launcher-linux-arm64" = "pybox/bin/pybox-launcher-linux-arm64"

[tool.hatch.build.targets.wheel]
exclude = ["examples"]

[tool.hatch.build.targets.sdist]
exclude = ["examples"]
